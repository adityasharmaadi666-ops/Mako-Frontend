<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAKO Orders</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f7f3ef;margin:0;padding:25px;color:#222}
    h1{margin-bottom:5px}
    button{background:#e85d04;color:white;border:0;padding:10px 18px;border-radius:8px;cursor:pointer}
    .status{margin:15px 0;padding:12px;background:white;border-radius:10px}
    .order{background:white;margin:15px 0;padding:18px;border-radius:12px;box-shadow:0 2px 8px #ddd}
    .row{margin:6px 0}
    .label{font-weight:bold}
    pre{white-space:pre-wrap;word-break:break-word}
  </style>
</head>

<body>

<h1>MAKO Orders</h1>
<p>Admin Order Dashboard</p>

<button onclick="loadOrders()">Refresh Orders</button>

<div id="status" class="status">Loading orders...</div>
<div id="orders"></div>

<script>
const API = "https://mako-backend.onrender.com";

async function loadOrders() {
  const status = document.getElementById("status");
  const container = document.getElementById("orders");

  status.innerText = "Loading...";
  container.innerHTML = "";

  try {
    const response = await fetch(API + "/api/orders");

    if (!response.ok) {
      throw new Error("API returned " + response.status);
    }

    const data = await response.json();

    const orders = Array.isArray(data)
      ? data
      : (data.orders || data.items || []);

    status.innerText = orders.length + " order(s) found";

    if (!orders.length) {
      container.innerHTML = "<div class='order'>No orders found.</div>";
      return;
    }

    orders.forEach(order => {
      const box = document.createElement("div");
      box.className = "order";

      box.innerHTML = `
        <div class="row"><span class="label">Order ID:</span> ${order.id || "-"}</div>
        <div class="row"><span class="label">Customer:</span> ${order.name || order.customer_name || "-"}</div>
        <div class="row"><span class="label">Phone:</span> ${order.phone || "-"}</div>
        <div class="row"><span class="label">Email:</span> ${order.email || "-"}</div>
        <div class="row"><span class="label">Address:</span> ${order.address || "-"}</div>
        <div class="row"><span class="label">Total:</span> ₹${order.total || order.amount || "-"}</div>
        <div class="row"><span class="label">Status:</span> ${order.status || "-"}</div>
        <pre>${JSON.stringify(order, null, 2)}</pre>
      `;

      container.appendChild(box);
    });

  } catch (error) {
    status.innerText = "ERROR: " + error.message;
    container.innerHTML =
      "<div class='order'>Could not load orders. Check the backend API.</div>";
  }
}

loadOrders();
</script>

</body>
</html>
